<div class="profile-container" style="padding: 20px; font-family: Arial, sans-serif;">
  <h2 style="color: #004d40;">My Enrolled Courses</h2>
  <div *ngIf="(enrolledCourses$ | async) as enrolledCourses">
    <ul *ngIf="enrolledCourses.length > 0; else noCourses" style="list-style-type: none; padding: 0;">
      <li *ngFor="let course of enrolledCourses" style="padding: 10px; border: 1px solid #ddd; margin-bottom: 8px; border-radius: 4px; background-color: #f9f9f9;">
        <strong>{{ course.name }}</strong> ({{ course.code }})
      </li>
    </ul>
    <ng-template #noCourses>
      <p>You have not enrolled in any courses yet.</p>
    </ng-template>
  </div>
</div>
